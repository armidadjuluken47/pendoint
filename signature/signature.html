<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ciro Muiruri — Signature</title>
  <!-- Beautiful type for local preview. Paste only the table into email clients. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Josefin+Sans:wght@300;400;500&family=Lato:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    @font-face { font-family: "Cormorant Garamond"; src: url("fonts/cormorant-700.ttf") format("truetype"); font-weight: 700; }
    @font-face { font-family: "Josefin Sans"; src: url("fonts/josefin-300.ttf") format("truetype"); font-weight: 300; }
    @font-face { font-family: "Josefin Sans"; src: url("fonts/josefin-400.ttf") format("truetype"); font-weight: 400; }
    @font-face { font-family: "Lato"; src: url("fonts/lato-400.ttf") format("truetype"); font-weight: 400; }
    body { margin: 0; padding: 32px; background: #cfcfcf; }
  </style>
</head>
<body>

<!-- ========== COPY FROM HERE (table only) ========== -->
<table cellpadding="0" cellspacing="0" border="0" width="680" style="width:680px; max-width:680px; background-color:#061126; font-family:'Lato', Arial, Helvetica, sans-serif; color:#ffffff; border-collapse:collapse;">
  <tr>
    <!-- PROFILE PHOTO + top-left swoosh -->
    <td width="235" valign="top" style="width:215px; padding:0; vertical-align:top;">
      <table cellpadding="0" cellspacing="0" border="0" width="100%">
        <tr>
          <td style="padding:6px 0 0 6px; line-height:0; font-size:0;">
            <img src="swoosh-tl.png" width="72" alt="" style="display:block; width:72px; height:auto; border:0;" />
          </td>
        </tr>
        <tr>
          <td style="padding:4px 10px 20px 20px;">
            <table cellpadding="0" cellspacing="0" border="0" width="100%">
              <tr>
                <td style="border:2px solid #b99a57; border-radius:120px 120px 0 0; overflow:hidden;">
                  <img
                    src="ciro.webp"
                    width="215"
                    alt="Ciro Muiruri"
                    style="display:block; width:215px; height:285px; object-fit:cover; border:0;"
                  />
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>

    <!-- RIGHT CONTENT -->
    <td valign="middle" style="padding:25px 25px 25px 20px;">

      <!-- NAME — elegant high-contrast serif -->
      <div style="font-family:'Cormorant Garamond', 'Times New Roman', Times, Georgia, serif; font-size:36px; font-weight:700; letter-spacing:4px; color:#d2b36c; line-height:1.15; text-transform:uppercase;">
        Ciro Muiruri
      </div>

      <table cellpadding="0" cellspacing="0" border="0" width="100%">
        <tr>
          <td width="65%" style="border-top:2px solid #b99a57; padding-top:12px;"></td>
        </tr>
      </table>

      <!-- PROFESSIONAL TITLE — airy geometric sans -->
      <div style="font-family:'Josefin Sans', 'Helvetica Neue', Arial, Helvetica, sans-serif; font-size:11px; font-weight:300; line-height:1.9; letter-spacing:2.4px; color:#ffffff; text-transform:uppercase;">
        Founder &amp; Director<br>
        Pendo International Projects
      </div>

      <!-- LOGO -->
      <table cellpadding="0" cellspacing="0" border="0" style="margin-top:18px; margin-bottom:16px;">
        <tr>
          <td valign="middle" style="padding-right:15px; border-right:1px solid #b99a57;">
            <img
              src="pendo-logo.png"
              width="85"
              alt="Pendo International Projects"
              style="display:block; width:85px; max-height:75px; object-fit:contain; border:0;"
            />
          </td>
          <td valign="middle" style="padding-left:18px;">
            <div style="font-family:'Cormorant Garamond', 'Times New Roman', Times, Georgia, serif; font-size:22px; font-weight:700; letter-spacing:4px; color:#d2b36c; text-transform:uppercase;">
              Pendo
            </div>
            <div style="font-family:'Josefin Sans', 'Helvetica Neue', Arial, Helvetica, sans-serif; font-size:9px; font-weight:400; letter-spacing:3.5px; color:#d2b36c; margin-top:6px; text-transform:uppercase;">
              International Projects
            </div>
          </td>
        </tr>
      </table>

      <!-- TAGLINE -->
      <table cellpadding="0" cellspacing="0" border="0" width="100%">
        <tr>
          <td style="border-top:1px solid #b99a57; padding-top:12px; padding-bottom:12px;">
            <span style="font-family:'Josefin Sans', 'Helvetica Neue', Arial, Helvetica, sans-serif; font-size:10px; font-weight:400; letter-spacing:2px; color:#d2b36c; text-transform:uppercase;">

            </span>
          </td>
        </tr>
        <tr>
          <td style="border-top:1px solid #344052; padding-top:12px;"></td>
        </tr>
      </table>

      <!-- CONTACT DETAILS — clean readable sans -->
      <table cellpadding="0" cellspacing="0" border="0" style="font-family:'Lato', Arial, Helvetica, sans-serif; font-size:13px; font-weight:400; letter-spacing:0.6px; color:#ffffff;">

        <tr>
          <td width="44" valign="middle" style="padding:7px 0; width:44px;">
            <img src="icon-email.png" width="26" height="26" alt="" style="display:block; border:0; width:26px; height:26px;" />
          </td>
          <td valign="middle" style="padding:7px 0;">
            <a href="mailto:ciro@pendointl.org" style="color:#ffffff; text-decoration:none; font-family:'Lato', Arial, Helvetica, sans-serif; letter-spacing:0.6px;">
              ciro@pendointl.org
            </a>
          </td>
        </tr>

        <tr>
          <td width="44" valign="middle" style="padding:7px 0;">
            <img src="icon-linkedin.png" width="26" height="26" alt="" style="display:block; border:0; width:26px; height:26px;" />
          </td>
          <td valign="middle" style="padding:7px 0;">
            <a href="https://www.linkedin.com/company/pendo-international-projects/" style="color:#ffffff; text-decoration:none; font-family:'Lato', Arial, Helvetica, sans-serif; letter-spacing:0.6px;">
              LinkedIn
            </a>
          </td>
        </tr>

        <tr>
          <td width="44" valign="middle" style="padding:7px 0;">
            <img src="icon-web.png" width="26" height="26" alt="" style="display:block; border:0; width:26px; height:26px;" />
          </td>
          <td valign="middle" style="padding:7px 0;">
            <a href="https://www.pendointl.org" style="color:#ffffff; text-decoration:none; font-family:'Lato', Arial, Helvetica, sans-serif; letter-spacing:0.6px;">
              www.pendointl.org
            </a>
          </td>
        </tr>

      </table>

    </td>
  </tr>

  <!-- Bottom-right swoosh -->
  <tr>
    <td colspan="2" align="right" style="padding:0 10px 4px 0; line-height:0; font-size:0; text-align:right; background-color:#061126;">
      <img src="swoosh-br.png" width="80" alt="" style="display:block; width:80px; height:auto; border:0; margin-left:auto;" />
    </td>
  </tr>

  <!-- BOTTOM ACCENT -->
  <tr>
    <td colspan="2" style="height:5px; background-color:#08776d; font-size:1px; line-height:1px;">
      &nbsp;
    </td>
  </tr>
</table>

</html>
